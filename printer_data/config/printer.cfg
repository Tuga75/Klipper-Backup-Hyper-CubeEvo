## HyperCube Evo 220/220/180mm SKR 1.3 TMC2208 UART config

# printer.cfg

[include timelapse.cfg]
[exclude_object]
[include mainsail.cfg]
#[include PIS.cfg]
[include KAMP_Settings.cfg]

[include ./KAMP/Adaptive_Meshing.cfg]       # Include to enable adaptive meshing configuration.
[include ./KAMP/Line_Purge.cfg]             # Include to enable adaptive line purging configuration.
# [include ./KAMP/Voron_Purge.cfg]            # Include to enable adaptive Voron logo purging configuration.
[include ./KAMP/Smart_Park.cfg]     






[mcu]
serial:/dev/serial/by-id/usb-Klipper_lpc1768_02D0FF0542941DAF18C9FC59C02000F5-if00
serial:/dev/ttyACM0
baud: 250000

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0


 





#####################################################################
# 	X/Y Stepper Settings
#####################################################################

[stepper_x]

step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29
position_endstop: 0
position_min: 0
position_max: 210
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: P1.17
interpolate: False
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 999999




#####################################################################


[stepper_y]

step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40			
endstop_pin: !P1.27
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 50 				

[tmc2209 stepper_y]
uart_pin: P1.15
interpolate: False
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 999999




 
#####################################################################
# 	Z Stepper Settings
#####################################################################


[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8			
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 180

[tmc2209 stepper_z]
uart_pin: P1.10
interpolate: False
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 999999



[stepper_z1]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 8
			

[tmc2209 stepper_z1]
uart_pin: P1.8
interpolate: False
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 999999
	




#####################################################################
# 	Extruder
#####################################################################


[extruder]
step_pin: P0.1
dir_pin: !P0.0
enable_pin: !P0.10
microsteps: 32
rotation_distance: 22.6789511
gear_ratio: 50:17
max_power: 1.0
nozzle_diameter: 0.400
pressure_advance: 0.045
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: P0.24
control = pid
pid_kp = 30.323
pid_ki = 1.838
pid_kd = 125.083
min_temp:10
max_temp: 280
max_extrude_cross_section: 5


[tmc2209 extruder]
uart_pin: P1.1
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

	




#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: P2.5
sensor_type: Generic 3950
sensor_pin: P0.23
max_power: 0.6
min_temp: 0
max_temp: 120
control = pid
pid_kp = 40.806
pid_ki = 1.347
pid_kd = 309.106
pwm_cycle_time:0.02

#####################################################################
# 	Probe
#####################################################################


[bltouch]
sensor_pin: ^P1.25
control_pin: P2.0
x_offset: 35
y_offset: 13
#z_offset = 4


#####################################################################
# 	safe_z_home
#####################################################################

[safe_z_home]
home_xy_position: 108, 80
speed: 100
z_hop: 5
z_hop_speed: 5


#####################################################################
# 	bed_mesh
#####################################################################

[bed_mesh]
speed: 100
horizontal_move_z: 6
mesh_min: 45.0,20.16
mesh_max: 200,200
probe_count: 5,5
mesh_pps: 2,2
fade_start: 1
fade_end: 10
fade_target: 0


[input_shaper]
shaper_type_x = 2hump_ei
shaper_freq_x = 45.4
shaper_type_y = ei
shaper_freq_y = 33.6




#####################################################################
# 	gcode_macro
#####################################################################


##############################################
[gcode_macro z_tilt]
gcode:
  Z_TILT_ADJUST



####### G34 ##############################
[z_tilt] 
z_positions:  7, 105
             177, 105
             
points:       7, 105
             177, 105
             
speed: 30
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.05






[gcode_macro START_PRINT]
gcode:

      
 
    M140 S[first_layer_bed_temperature]          
    M190 S[first_layer_bed_temperature]

 BED_MESH_CALIBRATE




######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.



[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro M0]
gcode: 
     PAUSE




[pause_resume]



[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  M106 S0
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}
#####################################################################
# 	Fan Control
#####################################################################



[fan]
#Print Cooling Fan - Fan Pin
pin: P2.3






[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

#####################################################################
# 	Raspi Temp
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

#####################################################################
# 	Displays
#####################################################################


######################################################################
# "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
######################################################################

[display]
lcd_type: st7920
cs_pin: EXP1_4
sclk_pin: EXP1_5
sid_pin: EXP1_3
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
#kill_pin: ^!EXP2_8

[output_pin beeper]
pin: EXP1_1


########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"




#####################################################################
# 	Psu Control
#####################################################################


# Lets assume that it's Arduino pin 12
[output_pin psupower]
pin: P1.24
# power on
[gcode_macro PW_On]
gcode: SET_PIN PIN=psupower VALUE=1

# power off
[gcode_macro Pw_Off]
gcode: SET_PIN PIN=psupower VALUE=0


#####################################################################
# 	Led Light  Control
#####################################################################


[output_pin LED_pin]
pin: P2.4
pwm: True
value: 0

[gcode_macro LEDOFF]
gcode:  SET_PIN PIN=LED_pin VALUE=0


[gcode_macro LEDON]
gcode:  SET_PIN PIN=LED_pin VALUE=1




#####################################################################
# 	Sdcard
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes

